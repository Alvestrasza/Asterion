upstream asterion_internal_app {
    server 127.0.0.1:3011;
    keepalive 16;
}

server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name _;

    # Temporary internal-only test surface. Do not attach this listener to an
    # Internet-facing load balancer. Replace it with the authenticated site.
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow ::1;
    allow fc00::/7;
    deny all;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://asterion_internal_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
